<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="style.css">

    <script>
        function openCity(evt, cityName) {
            var i;
            var tabcontent = document.getElementsByClassName("tabcontent");
            var tablinks = document.getElementsByClassName("tablinks");

            // Cacher tous les contenus
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }

            // Retirer "active" de tous les boutons
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }

            // Afficher le contenu sélectionné
            document.getElementById(cityName).style.display = "block";

            // Activer le bouton sélectionné
            evt.currentTarget.className += " active";
        }
    </script>
</head>

<body>

<nav style="
    position: fixed;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 1000;
">

    <button
        onclick="openCity(event, 'Video')"
        style="
            border: none;
            background: none;
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: normal;
            color: black;
            text-align: left;
            writing-mode: horizontal-tb;
            transform: none;
            cursor: pointer;
        ">
        Video
    </button>

    <button
        onclick="openCity(event, 'Pictures')"
        style="
            border: none;

            writing-mode: horizontal-tb;

            cursor: pointer;

    </button>

    <button
        onclick="openCity(event, 'Objects')"

    <button

        Paintings
    </button>

    <button
        onclick="openCity(event, 'Bio')"

            border: none;

            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            color: black;

            writing-mode: horizontal-tb;
            transform: none;
            cursor: pointer;
        ">
        Bio
    </button>

</nav>

    <main>

        <section id="Video" class="tabcontent">
            <img src="images/swim.png" alt="Video">
        </section>


        <section id="Pictures" class="tabcontent">
            <!-- Tes images ici -->
        </section>


        <section id="Objects" class="tabcontent">
            <!-- Tes objets ici -->
        </section>


        <section id="Paintings" class="tabcontent">
            <!-- Tes peintures ici -->
        </section>


        <section id="Bio" class="tabcontent">
            <!-- Ta biographie ici -->
        </section>

    </main>


    <script>
        // Ouvre automatiquement le premier onglet
        document.querySelector(".tablinks").click();
    </script>

</body>
</html>
