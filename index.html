<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="style.css">

    <script>
        function openCity(evt, cityName) {
            var i;
            var tabcontent = document.getElementsByClassName("tabcontent");
            var tablinks = document.getElementsByClassName("tablinks");

            // Cacher tous les contenus
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }

            // Retirer "active" de tous les boutons
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }

            // Afficher le contenu sélectionné
            document.getElementById(cityName).style.display = "block";

            // Activer le bouton sélectionné
            evt.currentTarget.className += " active";
        }
    </script>
</head>

<body>

<div class="signature">
    <img src="images/Gwendoline.Capron.png" alt="Gwendoline">
</div>
    
<nav>

    <button class="tablinks" onclick="openCity(event, 'Video')">
       Film & video
    </button>

    <button class="tablinks" onclick="openCity(event, 'Photo')">
        Photo
    </button>

    <button class="tablinks" onclick="openCity(event, 'Edition')">
        Personnages féminins : Attitudes, expressions
    </button>

    <button class="tablinks" onclick="openCity(event, 'Paintings')">
        Painting
    </button>

    <button class="tablinks" onclick="openCity(event, 'Contact')">
        Contact
    </button>

</nav>
    
<main>

   <section id="Video" class="tabcontent">

        <div class="video">
            <div style="padding:56.25% 0 0 0;position:relative;">

                <iframe
                    src="https://www.youtube.com/embed/hgiRoNqzcGo"
                    frameborder="0"
                    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    style="position:absolute;top:0;left:0;width:100%;height:100%;"
                    title="memory1">
                </iframe>

            </div>
        </div>


        <div class="video">
            <div style="padding:56.25% 0 0 0;position:relative;">

                <iframe
                    src="https://www.youtube.com/watch?v=RdSx9itgbs0"
                    frameborder="0"
                    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    style="position:absolute;top:0;left:0;width:100%;height:100%;"
                    title="memory2000_2">
                </iframe>

            </div>
        </div>

    </section>


    <section id="Photo" class="tabcontent">
    </section>


    <section id="Edition" class="tabcontent">
        
        <div class="edition">
            <img src="images/C_001bis.png" alt="Edition">
            <img src="images/C_002.png" alt="Edition">
        </div>

    </section>


    <section id="Painting" class="tabcontent">
    </section>


    <section id="Contact" class="tabcontent">
    </section>

</main>

    <script src="script.js"></script>

    <script>
        // Ouvre automatiquement le premier onglet
        document.querySelector(".tablinks").click();
    </script>

</body>
</html>
